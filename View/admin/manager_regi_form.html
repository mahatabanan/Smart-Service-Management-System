<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manager Registration</title>

    <style>

        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Segoe UI", Arial, sans-serif;
}

        /* Page background */
        body {
            margin: 0;
            padding: 0;
            background-color: #e6eef0;
            font-family: Arial, sans-serif;
        }

        /* TOP HEADER */
.top-header {
    width: 300px;
    background: #005f7a;
    border-radius: 8px;
    padding: 14px;
    margin: 20px;
    font-weight: 600;
    text-align: center;
    color: #E6F6FB;
    box-shadow: 0 4px 10px rgba(0,0,0,0.08);
}

        /* Main card */
        #card {
            width: 550px;
            background-color: #ffffff;
            padding: 30px;
            border-radius: 15px;
            margin: 50px auto;
            box-shadow: 0 10px 20px rgba(0,0,0,0.15);
            text-align: center;
        }

        /* Logo section */
        #section {
            margin-bottom: 15px;
        }

        #logo {
            width: 120px;
            margin-bottom: 10px;
        }

        /* Headings */
        h3 {
            margin: 10px 0 5px;
            color: #222;
        }

        p.subtitle {
            margin: 0 0 20px;
            font-size: 14px;
            color: #555;
        }

        /* Form group */
        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }

        /* Labels */
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
            color: #333;
        }

        /* Inputs & textarea */
        input,
        textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-size: 14px;
        }

        textarea {
            resize: none;
            height: 80px;
        }

        /* Focus effect */
        input:focus,
        textarea:focus {
            outline: none;
            border-color: #0b78a5;
        }

        /* Submit button */
        .submit-btn {
            width: 100%;
            margin-top: 25px;
            background-color: #0b78a5; /* SAME reference color */
            color: white;
            border: none;
            font-size: 16px;
            font-weight: bold;
            padding: 12px;
            border-radius: 6px;
            cursor: pointer;
        }

        .submit-btn:hover {
            background-color: #095f84;
        }

        /* Footer */
        .footer-text {
            margin-top: 18px;
            font-size: 13px;
            color: #555;
        }

        .footer-text a {
            color: #0b78a5;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>
<body>
   <div class="top-header">
    <h2>+ADD Manager</h2>
   </div>
    <div id="card">

        <div id="section">
            <img src="../../View/logo/logo.png" id="logo" alt="Logo">
            <h3>Manager Registration Form </h3>
            
        </div>

        <form action="" method="post">

            <div class="form-group">
                <label for="manager_name">Manager Name</label>
                <input type="text" id="manager_name" name="manager_name" placeholder="Enter manager name" required>
            </div>

            <div class="form-group">
                <label for="phone">Phone</label>
                <input type="tel" id="phone" name="phone" placeholder="Enter phone number" required>
            </div>

            <div class="form-group">
                <label for="address">Address</label>
                <textarea id="address" name="address" placeholder="Enter address" required></textarea>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter password" required>
            </div>

            <button type="submit" class="submit-btn">Add Manager</button>
        </form>

        <!--<div class="footer-text">
            Already have an account? <a href="login.php">Login</a>
        </div>-->


    </div>

</body>
</html>
